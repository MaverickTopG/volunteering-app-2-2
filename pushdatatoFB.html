  <!-- Import Firebase SDK modules from CDN -->
  <script type="module">
    // Import Firebase functions from the CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

   
// Array of updated organizations
const orgs = 
[
  {
    "title": "Alliance for Technology Access",
    "address": "San Rafael, CA",
    "county": "Marin County",
    "date": "Updated: June 28, 2001",
    "reference": "Tech",
    "description": "The ATA is a national network of centers, developers, educators, and families dedicated to promoting access to technology for people with disabilities."
  },
  {
    "title": "Computer & Technology Resource Center",
    "address": "NOVATO, CA",
    "county": "Marin County",
    "date": "Updated: March 9, 2014",
    "reference": "Tech",
    "description": "CTRC recycles household electronics and provides free refurbished computers to help narrow the digital divide in the San Francisco Bay Area."
  },
  {
    "title": "CoDA - Center for Digital Archaeology",
    "address": "San Rafael, CA",

    "date": "Updated: June 20, 2016",

  },
  {
    "title": "GRACESIGNS",

    "county": "Marin County",
    "date": "Updated: February 12, 2016",
    "reference": "Tech",
    "description": "GraceSigns develops educational apps for learning sign language and reading, aiming to enhance communication and disability awareness through innovative technology."
  },
  {
    "title": "BUCK INSTITUTE FOR RESEARCH ON AGING",
    "address": "NOVATO, CA",

  }
]



;



    async function uploadOrgs() {
      // Reference to the 'volunteer_orgs' collection
      const collectionRef = collection(db, "volunteer_organizations");

      for (const org of orgs) {
        // Construct a doc ID combining reference + title
        // e.g. "Education_ACADEMY FOR INTERNATIONAL CULTURE AND PROFESSIONAL EDUCATION"
        const docId = `${org.reference}_${org.title}`;
        const docRef = doc(collectionRef, docId);

        try {
          await setDoc(docRef, org);
          console.log(`Uploaded: ${docId}`);
        } catch (error) {
          console.error(`Error uploading ${docId}:`, error);
        }
      }
      console.log("All organizations have been uploaded!");
    }

    // Automatically upload on page load
    window.addEventListener("load", () => {
      uploadOrgs();
    });
  </script>
</head>
<body>
  <h1>Firebase Data Upload - Multiple Volunteer Orgs</h1>
  <p>Check your browser console for upload logs.</p>
</body>
