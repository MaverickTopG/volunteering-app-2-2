    async function uploadOrgs() {
      // Reference to the 'volunteer_orgs' collection
      const collectionRef = collection(db, "volunteer_organizations");

      for (const org of orgs) {
        // Construct a doc ID combining reference + title
        // e.g. "Education_ACADEMY FOR INTERNATIONAL CULTURE AND PROFESSIONAL EDUCATION"
        const docId = `${org.reference}_${org.title}`;
        const docRef = doc(collectionRef, docId);

        try {
          await setDoc(docRef, org);
          console.log(`Uploaded: ${docId}`);
        } catch (error) {
          console.error(`Error uploading ${docId}:`, error);
        }
      }
      console.log("All organizations have been uploaded!");
    }

    // Automatically upload on page load
    window.addEventListener("load", () => {
      uploadOrgs();
    });
