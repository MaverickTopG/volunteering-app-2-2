<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Firebase Data Clean-up - Delete Orgs Missing Contact Info</title>
  <!-- Import Firebase SDK modules from CDN -->
  <script type="module">
    // Import Firebase functions from the CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      deleteDoc,
      getDocs
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cleanOrgs() {
      // Reference to the 'volunteer_organizations' collection
      const collectionRef = collection(db, "volunteer_organizations");

      try {
        const querySnapshot = await getDocs(collectionRef);
        // Iterate through each document in the collection
        querySnapshot.forEach(async (docSnapshot) => {
          const data = docSnapshot.data();
          // Check: if neither website nor contactDetails is provided, delete the document.
          if (!data.website && !data.contactDetails) {
            try {
              await deleteDoc(docSnapshot.ref);
              console.log(`Deleted document "${docSnapshot.id}" due to missing website and contact details.`);
            } catch (deleteError) {
              console.error(`Error deleting document "${docSnapshot.id}":`, deleteError);
            }
          } else {
            console.log(`Keeping document "${docSnapshot.id}".`);
          }
        });
      } catch (error) {
        console.error("Error fetching documents:", error);
      }
    }

    // Run the clean-up process when the page loads
    window.addEventListener("load", () => {
      cleanOrgs();
    });
  </script>
</head>
<body>
  <h1>Firebase Data Clean-up</h1>
  <p>Processing deletion of organizations missing website and contact details. Check your browser console for logs.</p>
</body>
</html>
