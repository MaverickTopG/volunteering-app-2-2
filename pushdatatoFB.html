  <!-- Import Firebase SDK modules from CDN -->
  <script type="module">
    // Import Firebase functions from the CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // Your Firebase configuration (replace with your actual config)
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Function to push multiple organization documents into Firestore
    async function pushOrgs() {
      // Reference to the "volunteer_organizations" collection
      const collectionRef = collection(db, "volunteer_organizations");

      // Array of organization objects to push – add as many as you need
      const orgsData = [


]

;

      try {
        // Iterate through the array and push each document
        for (const org of orgsData) {
          const docRef = await addDoc(collectionRef, org);
          console.log(`Organization pushed with ID: ${docRef.id}`);
        }
      } catch (error) {
        console.error("Error pushing organizations:", error);
      }
    }

    // Run the push operation when the page loads
    window.addEventListener("load", () => {
      pushOrgs();
    });
  </script>

<body>
  <h1>Firebase Multiple Data Insertion</h1>
  <p>Organization data is being pushed to Firebase Firestore. Check your browser console for results.</p>
</body>
