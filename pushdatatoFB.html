<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Firebase Data Upload</title>
  <!-- Import Firebase SDK modules from CDN -->
  <script type="module">
    // Import Firebase functions from the CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // Your Firebase configuration (replace with your actual config)
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Array of volunteer fun facts
    const FACTS = [
      { fun_fact: "Volunteers are worth an average $28.54 an hour according to an Independent Sector Study." },
      { fun_fact: "Volunteers are almost twice as likely to donate to a charity than those that don’t volunteer according to The Corporation for National & Community Service." },
      { fun_fact: "Volunteerism has a value of over $184 billion dollars." },
      { fun_fact: "Volunteerism improves health by strengthening the body, improving mood, and lessening stress in participants." },
      { fun_fact: "Those who volunteer regularly have a 27% better chance of gaining employment." },
      { fun_fact: "60% of hiring managers see volunteerism as a valuable asset when making recruitment decisions." },
      { fun_fact: "Volunteers, on average, spend 50 hours per year donating their time to the greater good." },
      { fun_fact: "Aristotle once said: 'the essence of life is to serve others and do good.'" },
      { fun_fact: "Volunteers are 66% more likely to donate financially to the organization they support than non-volunteers." },
      { fun_fact: "77% of nonprofits believe that skilled volunteers could improve their organization's business practices." },
      { fun_fact: "66% of volunteers give their time to improve their community, and 83% do so to contribute to a cause they care about." },
      { fun_fact: "According to an AmeriCorps report, people who volunteer over 100 hours a year are among the healthiest in the U.S." },
      { fun_fact: "Utah has the highest rate of volunteers in America (51%)." },
      { fun_fact: "The COVID-19 response added more than 110,000 volunteer activities per month, double the rate in 2017." },
      { fun_fact: "Volunteering decreases the likelihood of high blood pressure development by 40%." },
      { fun_fact: "70% of corporate volunteers believe volunteerism boosts morale more than company mixers." },
      { fun_fact: "96% of volunteers reported that volunteering enriched their sense of purpose in life." }
    ];

    async function uploadFactsToFirebase() {
      // Reference to the new 'volunteer_funfacts' collection
      const collectionRef = collection(db, "volunteer_funfacts");

      for (let i = 0; i < FACTS.length; i++) {
        const item = FACTS[i];
        // Use a unique doc ID. For instance, 'fact-0', 'fact-1', etc.
        const docId = `fact-${i}`;
        const docRef = doc(collectionRef, docId);

        try {
          await setDoc(docRef, item);
          console.log(`Uploaded: ${item.fun_fact}`);
        } catch (error) {
          console.error(`Error uploading ${item.fun_fact}:`, error);
        }
      }
      console.log("All fun facts have been uploaded!");
    }

    // Automatically upload the facts when the page loads
    window.addEventListener("load", () => {
      uploadFactsToFirebase();
    });
  </script>
</head>
<body>
  <h1>Firebase Data Upload - Volunteer Fun Facts</h1>
  <p>Check your browser console for upload logs.</p>
</body>
</html>
