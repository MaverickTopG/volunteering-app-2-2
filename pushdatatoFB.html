    async function uploadDataToFirebase() {
        const collectionRef = collection(db, "volunteer_organizations");

        for (const org of DATA) {
          // Replace any slashes in title
          const safeDocId = org.title.replace(/\//g, "-");
          const docRef = doc(collectionRef, safeDocId);

          try {
            await setDoc(docRef, org);
            console.log(`Uploaded: ${org.title}`);
          } catch (error) {
            console.error(`Error uploading ${org.title}:`, error);
          }
        }
      }

      window.addEventListener("load", () => {
        uploadDataToFirebase();
      });
