<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Append Fields to themePacks</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // ← your real config here
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    async function appendFlags() {
      const colRef = collection(db, "themePacks");
      const snap   = await getDocs(colRef);
      console.log(`Found ${snap.size} docs. Updating…`);

      let i = 0;
      for (const docSnap of snap.docs) {
        const id = docSnap.id;
        try {
          await setDoc(
            doc(db, "themePacks", id),
            { bought: false, activated: false },
            { merge: true }
          );
          console.log(`✅ [${++i}/${snap.size}] Updated ${id}`);
        } catch (e) {
          console.error(`❌ [${++i}/${snap.size}] ${id}`, e);
        }
      }

      console.log("🎉 All themePacks documents have been updated.");
    }

    window.addEventListener("load", appendFlags);
  </script>
</head>
<body>
  <h1>Appending `bought` & `activated` to every themePack…</h1>
  <p>Open your browser console to follow along.</p>
</body>
</html>
