<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NexoLink County Merge & State Set</title>
  <style>
    body { font-family: sans-serif; background: #F7F3EB; padding: 2rem; }
    button { padding: .75rem 1.5rem; background: #FFE8C9; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #FFD4A4; }
    #log { margin-top: 1rem; max-height: 70vh; overflow-y: auto; background: white; padding: 1rem; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); white-space: pre-wrap; }
    .entry { margin-bottom: .5rem; font-size: .9rem; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      writeBatch,
      doc
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const logEl = document.getElementById("log");
    function log(msg) {
      const d = document.createElement("div");
      d.className = "entry";
      d.textContent = msg;
      logEl.appendChild(d);
    }

    // Capitalize each word
    function toTitleCase(str) {
      return str.replace(/\w\S*/g, txt =>
        txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()
      );
    }

    document.getElementById("runBtn").onclick = async () => {
      logEl.innerHTML = "";
      log("▶ Starting county normalization & state assignment…\n");

      // 1) Fetch all docs
      const snap = await getDocs(collection(db, "volunteer_organizations"));
      const batch = writeBatch(db);
      let countCountyUpdates = 0;
      let countStateUpdates  = 0;

      snap.forEach(snapDoc => {
        const data = snapDoc.data();
        const origCounty = (data.county || "").trim();

        // Normalize county
        let base = origCounty.replace(/county/gi, "").trim();
        const canonical = toTitleCase(base) + " County";

        // If county differs, schedule its update
        if (origCounty !== canonical) {
          batch.update(
            doc(db, "volunteer_organizations", snapDoc.id),
            { county: canonical }
          );
          log(`  📝 [${snapDoc.id}] county: "${origCounty}" → "${canonical}"`);
          countCountyUpdates++;
        }

        // Always (re)write state = "California"
        batch.update(
          doc(db, "volunteer_organizations", snapDoc.id),
          { state: "California" }
        );
        countStateUpdates++;
      });

      if (countCountyUpdates === 0) {
        log("ℹ️ No county fields needed normalization.");
      }
      log(`ℹ️ Added/updated 'state' on ${countStateUpdates} documents.`);

      // 2) Commit batch
      await batch.commit();
      log("\n✅ All updates committed!");
    };
  </script>
</head>
<body>
  <h1>NexoLink County Merge & State Set</h1>
  <p>This will normalize every doc’s <code>county</code> (strip and re‐append “ County”) and set <code>state: "California"</code> on all documents.</p>
  <button id="runBtn">Run Merge & State Assign</button>
  <div id="log"></div>
</body>
</html>
