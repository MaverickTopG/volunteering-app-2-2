<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Initialize Badges for All Users</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1rem;
      text-align: center;
      font-weight: 500;
    }
    ul {
      margin-top: 1rem;
      padding-left: 1.2rem;
      max-height: 240px;
      overflow-y: auto;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    li {
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    .error {
      color: #d9534f;
    }
    .success {
      color: #28a745;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Initialize Badges for All Users</h1>
    <p>
      This script will read every document ID under the <code>names</code> collection (each assumed to be a user‐UID), and for each UID it will create:
    </p>
    <ul>
      <li><strong>/badges/&lt;UID&gt;/badgeData/badgeStatus</strong> (all badge IDs set to false)</li>
      <li><strong>/badges/&lt;UID&gt;/badgeData/selectedBadges</strong> (<code>{ badges: [] }</code>)</li>
    </ul>
    <button id="initBtn">Initialize Badges for All Users</button>
    <div id="status"></div>
    <ul id="logList"></ul>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────────
    // 1) FIREBASE CONFIGURATION
    // Replace the placeholder values below with your Firebase project’s settings:
    //   * apiKey
    //   * authDomain
    //   * projectId
    //   * storageBucket
    //   * messagingSenderId
    //   * appId
    // You can find these in Firebase Console → Project Settings → Your apps → Firebase SDK snippet.
    const firebaseConfig = {
        apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
  authDomain: "nexolink-b8eb5.firebaseapp.com",
  projectId: "nexolink-b8eb5",
  storageBucket: "nexolink-b8eb5.appspot.com",
  messagingSenderId: "247675121621",
  appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Firestore reference
    const firestore = firebase.firestore();

    // ──────────────────────────────────────────────────────────────────────────
    // 2) BADGE ID LIST
    // Exactly match these IDs with what your React Native app expects.
    const BADGE_IDS = [
      'first_volunteer',
      'early_bird',
      'weekend_warrior',
      'helping_hand',
      'community_helper',
      'dedication',
      'commitment',
      'champion',
      'hero',
      'legend',
      'streak_3',
      'streak_7',
      'streak_30',
      'animal_lover',
      'food_hero',
      'education_supporter',
      'environment_guardian',
      'senior_friend',
      'youth_mentor',
      'health_advocate',
      'team_player',
      'solo_hero',
      'night_owl',
      'rain_or_shine',
      'holiday_helper',
      'impact_maker',
      'inspiration',
      'changemaker',
      'community_pillar',
      'volunteer_master'
    ];

    // ──────────────────────────────────────────────────────────────────────────
    // 3) UI ELEMENTS
    const initBtn   = document.getElementById('initBtn');
    const statusDiv = document.getElementById('status');
    const logList   = document.getElementById('logList');

    // Append a log line to the on‐screen list
    function appendLog(message, type = '') {
      const li = document.createElement('li');
      li.textContent = message;
      if (type === 'error') li.classList.add('error');
      if (type === 'success') li.classList.add('success');
      logList.appendChild(li);
      logList.scrollTop = logList.scrollHeight;
    }

    // ──────────────────────────────────────────────────────────────────────────
    // 4) MAIN CLICK HANDLER
    initBtn.addEventListener('click', async () => {
      initBtn.disabled = true;
      statusDiv.textContent = '⏳ Fetching all user UIDs from "names" collection…';
      logList.innerHTML = ""; // clear previous logs

      try {
        // 4.1) Read every document in "names" collection
        const namesSnapshot = await firestore.collection('names').get();

        if (namesSnapshot.empty) {
          statusDiv.textContent = 'ℹ️ No users found in the "names" collection.';
          initBtn.disabled = false;
          return;
        }

        statusDiv.textContent = `ℹ️ Found ${namesSnapshot.size} user(s). Initializing badges…`;
        appendLog(`Found ${namesSnapshot.size} documents in "names".`);

        // Pre‐build the badgeStatus object with all IDs = false
        const badgeStatusTemplate = {};
        BADGE_IDS.forEach(id => {
          badgeStatusTemplate[id] = false;
        });

        let successCount = 0;
        let failCount = 0;

        for (const doc of namesSnapshot.docs) {
          const uid = doc.id;
          try {
            // 4.2a) Write badgeStatus only if not already exists
            const badgeStatusRef = firestore
              .collection('badges')
              .doc(uid)
              .collection('badgeData')
              .doc('badgeStatus');

            const badgeStatusSnap = await badgeStatusRef.get();
            if (!badgeStatusSnap.exists) {
              await badgeStatusRef.set(badgeStatusTemplate);
              appendLog(`✅ Created badgeStatus for UID=${uid}`, 'success');
            } else {
              appendLog(`ℹ️ badgeStatus already exists for UID=${uid}`);
            }

            // 4.2b) Always (re)write selectedBadges to { badges: [] }
            const selectedBadgesRef = firestore
              .collection('badges')
              .doc(uid)
              .collection('badgeData')
              .doc('selectedBadges');

            await selectedBadgesRef.set({ badges: [] });
            appendLog(`✅ Initialized selectedBadges for UID=${uid}`, 'success');

            successCount++;
          } catch (innerError) {
            appendLog(`❌ Failed UID=${uid}: ${innerError.message}`, 'error');
            failCount++;
          }
        }

        statusDiv.textContent = `✅ Done! ${successCount} succeeded, ${failCount} failed.`;
      } catch (error) {
        console.error("Error fetching 'names' collection:", error);
        statusDiv.textContent = `❌ Error: ${error.message}`;
      } finally {
        initBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
